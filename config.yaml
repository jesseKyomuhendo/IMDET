# : separates key and value
# Indentation (2 spaces, not tabs) creates nesting
# No quotes needed for simple values
# "#" for comments

# This block is meant for debugging .yaml file (Not used in the project)
debug-yaml:
  message: "Image manipulation detection"
  number: 1000

# ─────────────────────────────────────────
# Project configuration
# ─────────────────────────────────────────

# Dataset paths (relative to project root)
data:
  casia_dir: data/CASIA2.0         # Contains copy_move/, splicing/, authentic/
  columbia_dir: data/Columbia      # Contains 4cam_auth/, 4cam_splc/
  split_dir: data/splits           # Output folder for train/val/test CSV files

# Dataset split ratios (must sum to 1.0)
split:
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42                         # Random seed for reproducibility

# Classes
classes:
  - authentic
  - copy_move
  - splicing

# Training
training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.00001
  early_stopping_patience: 45      # Stop if val loss does not improve for N epochs
  imbalance_strategy: class_weights  # Options: class_weights | oversampling

# Model
model:
  backbone: resnet50               # Options: resnet50, vgg16
  pretrained: true                 # Use ImageNet pretrained weights
  num_classes: 3
  save_path: model/best_model.keras  # Where to save the trained model

# Image preprocessing
image:
  size: 224                        # Resize all images to size x size

# Evaluation
evaluation:
  metrics:
    - accuracy
    - f1
    - auc
    - confusion_matrix
  results_dir: results             # Where to save evaluation outputs